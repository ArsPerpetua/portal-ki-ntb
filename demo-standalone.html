function documentsPage(){const tabs=['Semua','Sambutan','Materi Narasumber','Dokumen Pendukung','Referensi'];return header('ARSIP & PENGETAHUAN','Pusat dokumen','Sambutan, materi narasumber, dan bukti pendukung dalam satu tempat.',`<button class="primary-btn" data-upload>${ico('plus',17)} Tambah dokumen</button>`)+`<div class="doc-stats">${docStat('folder',docs.length,'Total dokumen')}${docStat('file',docs.filter(d=>d.category==='Materi Narasumber').length,'Materi narasumber')}${docStat('file',docs.filter(d=>d.category==='Sambutan').length,'Naskah sambutan')}${docStat('shield','Privat','Skema akses')}</div><div class="doc-panel panel"><div class="doc-panel-top"><div class="doc-tabs">${tabs.map(t=>`<button class="${state.cat===t?'selected':''}" data-cat="${t}">${t}</button>`).join('')}</div><div class="document-controls"><label class="input-search">${ico('search',17)}<input id="docSearch" placeholder="Cari nama dokumen..." value="${esc(state.docQ)}"></label><label class="filter-select">${ico('grid',16)}<select id="docFilter"><option value="all">Semua indikator</option>${records.map(r=>`<option value="${r.id}" ${state.filter===r.id?'selected':''}>${r.short}</option>`).join('')}</select>${ico('down',14)}</label></div></div><div id="docTable">${tableDocuments()}</div></div>`}
function appsPage(){let a=[['Pangkalan Data KI','Pencarian dan penelusuran informasi kekayaan intelektual.','db','#e5f4ee'],['Layanan Permohonan KI','Akses proses layanan dan pengajuan kekayaan intelektual.','folder','#fbf0e6'],['Dashboard Pelaporan','Rekapitulasi dan ringkasan pelaksanaan kegiatan.','layout','#ecedfb'],['Referensi Hukum','Kumpulan rujukan dan bahan edukasi terkait KI.','book','#edf4f7']];return header('AKSES CEPAT','Katalog aplikasi','Temukan pintasan ke layanan dan aplikasi pendukung pekerjaan KI.')+`<div class="info-strip">${ico('info',19)}<div><b>Kartu katalog berikut contoh tata letak.</b><span>Admin mengisi URL resmi dan ikon aplikasi pada sistem produksi.</span></div></div><div class="apps-grid">${a.map(x=>`<button class="app-card" data-catalog><span class="app-graphic" style="background:${x[3]}">${ico(x[2],30)}</span><span class="app-badge">KATALOG INTERNAL</span><b>${x[0]}</b><p>${x[1]}</p><span class="app-link">Lihat detail ${ico('up',16)}</span></button>`).join('')}</div>`}
function activityPage(){return header('AUDIT & MONITORING','Riwayat aktivitas','Rekam jejak perubahan data, dokumen, dan verifikasi pengguna.','<span class="dot-tag"><i></i>Contoh aktivitas</span>')+`<div class="activity-layout"><section class="panel activity-full"><div class="panel-head"><div><span class="section-overline">JEJAK PERUBAHAN</span><h3>Aktivitas terbaru</h3></div><span class="pill-minor">Dari 7 hari terakhir</span></div>${activity()}</section><section class="panel status-card"><div class="status-icon">${ico('shield',27)}</div><h3>Audit log sejak hari pertama</h3><p>Di sistem produksi, perubahan administrasi disimpan bersama identitas, waktu, dan perubahan relevan.</p>${['Identitas pengubah','Waktu & jenis aksi','Sebelum dan sesudah (sesuai izin)'].map(x=>`<div class="status-row">${ico('check',16)} ${x}</div>`).join('')}</section></div>`}
function settingsPage(){return header('KONFIGURASI SISTEM','Pengaturan & akses','Rancangan kontrol peran, penugasan indikator, dan kesiapan layanan.')+`<div class="settings-tabs"><button data-settings="akses" class="${state.settings==='akses'?'selected':''}">${ico('users',17)} Peran & hak akses</button><button data-settings="integrasi" class="${state.settings==='integrasi'?'selected':''}">${ico('db',17)} Integrasi layanan</button></div>${state.settings==='akses'?`<div class="settings-layout"><section class="panel settings-main"><div class="panel-head"><div><span class="section-overline">KEAMANAN DATA</span><h3>Matriks peran pengguna</h3></div></div><div class="table-scroll"><table class="data-table roles-table"><thead><tr><th>Hak akses</th><th>Superadmin</th><th>Staf</th><th>Pimpinan</th></tr></thead><tbody>${[['Lihat dashboard','Ya','Ya','Ya'],['Lihat dokumen berizin','Ya','Ya','Ya'],['Kelola indikator','Ya','Penugasan','—'],['Upload dokumen','Ya','Penugasan','—'],['Kelola pengguna','Ya','—','—'],['Verifikasi angka resmi','Ya','—','—']].map(row=>`<tr><td><b>${row[0]}</b></td>${row.slice(1).map(s=>`<td>${s==='Ya'?`<span class="role-yes">${ico('check',16)} Ya</span>`:s==='Penugasan'?'<span class="role-assigned">Sesuai penugasan</span>':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section><section class="panel access-aside"><div class="status-icon">${ico('lock',25)}</div><h3>Indikator bersifat granular</h3><p>Penugasan staf dilakukan per indikator, bukan cukup berdasarkan role global.</p>${['RLS di PostgreSQL','Validasi backend','Catatan audit'].map(x=>`<div class="access-chip">${ico('check',16)} ${x}</div>`).join('')}</section></div>`:`<div class="integration-grid">${[['Supabase','Autentikasi, database PostgreSQL, akses per indikator.','db'],['Google Drive','File privat melalui akun Gmail arsip khusus kantor.','folder'],['Netlify','Hosting frontend dan endpoint integrasi.','globe']].map(s=>`<div class="panel integration-card"><span>${ico(s[2],25)}</span><h3>${s[0]}</h3><p>${s[1]}</p><div class="integration-status"><span class="indicator-not-connected"></span> Belum terhubung (prototype)</div></div>`).join('')}</div>`}`}
function render(){const name=state.selected?findId(state.selected)?.short:nav.find(n=>n[0]===state.page)?.[1];document.querySelector('#breadcrumbCurrent').textContent=name||'Portal';document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===state.page));const root=document.querySelector('#content');root.innerHTML=({dashboard,indikator:state.selected?details:directory,dokumen:documentsPage,aplikasi:appsPage,aktivitas:activityPage,pengaturan:settingsPage})[state.page]()+`<footer class="footer"><span>© 2026 Portal Digital KI NTB · Prototype UI</span><span>Dirancang untuk alur kerja internal <span class="footer-dot">•</span> Data simulasi</span></footer>`;animCounts();}
function navigate(page){state.page=page;state.selected=null;state.region='semua';document.querySelector('.sidebar').classList.remove('mobile-open');document.querySelector('#scrim').hidden=true;render();window.scrollTo({top:0,behavior:'smooth'})}
function openIndicator(id){state.page='indikator';state.selected=id;state.region='semua';render();window.scrollTo({top:0,behavior:'smooth'})}
function animCounts(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.querySelectorAll('.count-up').forEach(el=>{const value=+el.dataset.value,start=performance.now();const tick=(now)=>{let p=Math.min(1,(now-start)/800);el.textContent=Math.round(value*(1-(1-p)**3)).toLocaleString('id-ID');if(p<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)})}
function toast(msg){let t=document.querySelector('#toast');t.innerHTML=`${ico('info',18)} <span>${esc(msg)}</span><button data-toast-close aria-label="Tutup">${ico('x',15)}</button>`;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4300)}
function closeModal(){document.querySelector('#modalLayer').innerHTML=''}
function showModal(inner,wide=false){document.querySelector('#modalLayer').innerHTML=`<div class="modal-backdrop" data-modal-backdrop><div class="${wide?'search-modal':'upload-modal'}" role="dialog" aria-modal="true">${inner}</div></div>`}
function showDoc(id){const d=docs.find(x=>x.id===id);if(!d)return;showModal(`<div class="modal-head"><div><span class="section-overline">DETAIL DOKUMEN</span><h3>Informasi berkas</h3></div><button class="icon-btn" data-close aria-label="Tutup">${ico('x',20)}</button></div><div class="detail-file-top"><span class="big-file-icon">${ico('file',29)}</span><div><b>${esc(d.name)}</b><small>${d.format} • ${d.size}</small></div></div><div class="detail-fields">${[['Kategori',d.category],['Indikator',findId(d.indicator)?.label||'Umum'],['Pengunggah',d.owner],['Tanggal',d.date],['Akses','Internal / Privat'],['Status',d.id.startsWith('LOCAL-')?'Disimpan di browser':'Dokumen simulasi']].map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b></div>`).join('')}</div><div class="demo-warning">${ico('info',17)}<span>${d.id.startsWith('LOCAL-')?'File ini hanya berada di browser, belum masuk Drive.':'Ini metadata contoh. Berkas asli belum tersedia di Google Drive.'}</span></div><div class="modal-actions"><button class="secondary-btn" data-close>Tutup</button><button class="primary-btn" data-download="${d.id}">${ico('download',17)} Unduh berkas</button></div>`)}
function uploadDialog(){showModal(`<div class="modal-head"><div><span class="section-overline">PUSAT DOKUMEN</span><h3>Tambah dokumen</h3><p>Unggah contoh file pada sesi demo lokal.</p></div><button class="icon-btn" data-close aria-label="Tutup">${ico('x',20)}</button></div><label class="dropzone"><input type="file" id="uploadFile" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.png,.jpg,.jpeg"><span class="dropzone-icon">${ico('upload',26)}</span><b id="chosenFile">Klik untuk pilih dokumen</b><small id="chosenSize">PDF, DOCX, PPTX, XLSX, JPG, PNG • maks. 10 MiB</small></label><div class="form-row"><label>Kategori dokumen<select id="uploadType"><option>Sambutan</option><option selected>Materi Narasumber</option><option>Dokumen Pendukung</option><option>Referensi</option></select></label><label>Indikator terkait<select id="uploadIndicator"><option value="none">Umum / tidak spesifik</option>${records.map(r=>`<option value="${r.id}">${r.short}</option>`).join('')}</select></label></div><div class="demo-warning">${ico('info',17)}<span>File hanya disimpan sementara di tab browser. Tidak dikirim ke Supabase atau Drive.</span></div><div class="modal-actions"><button class="secondary-btn" data-close>Batal</button><button class="primary-btn" data-save-upload>${ico('upload',17)} Simpan ke demo</button></div>`)}
function searchDialog(){const s=`<div class="search-modal-input">${ico('search',22)}<input id="globalSearch" value="${esc(state.searchQ)}" placeholder="Cari indikator KI, materi, sambutan..." autofocus><button data-close>ESC</button></div><div class="search-results" id="searchResults"></div><div class="search-modal-foot">Tekan <kbd>ESC</kbd> untuk menutup <span><kbd>⌘</kbd> + <kbd>K</kbd> untuk membuka</span></div>`;showModal(s,true);renderSearch();document.querySelector('#globalSearch').focus()}
function renderSearch(){let res=document.querySelector('#searchResults');if(!res)return;let q=state.searchQ.toLowerCase().trim();let ri=records.filter(r=>(r.label+' '+r.short+' '+r.desc).toLowerCase().includes(q)),rd=docs.filter(d=>(d.name+' '+d.category).toLowerCase().includes(q));res.innerHTML=`<div class="search-category">INDIKATOR KI</div>${ri.map(r=>`<button class="search-result" data-open="${r.id}"><span class="result-icon">${ico('layers',17)}</span><span><b>${r.short}</b><small>${r.label}</small></span>${ico('up',16)}</button>`).join('')}<div class="search-category second">DOKUMEN</div>${rd.slice(0,5).map(d=>`<button class="search-result" data-document="${d.id}"><span class="result-icon">${ico('file',17)}</span><span><b>${esc(d.name)}</b><small>${d.category}</small></span>${ico('up',16)}</button>`).join('')}${!ri.length&&!rd.length?'<div class="empty-state"><h3>Tidak ditemukan</h3><p>Coba kata kunci lain.</p></div>':''}`}
const brandLogo='<svg viewBox="0 0 44 44" fill="none"><path d="M8 29.5 22 7l14 22.5-14 8L8 29.5Z" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><path d="m15 29 7-11 7 11-7 4-7-4Z" fill="currentColor"/><circle cx="22" cy="10" r="3" fill="#d6a36b"/></svg>';
document.querySelector('#app').innerHTML=`<div class="shell"><div class="mobile-scrim" id="scrim" hidden></div><aside class="sidebar"><button class="brand" data-nav="dashboard"><span class="brand-mark">${brandLogo}</span><span class="brand-text">PORTAL <b>KI NTB</b><small>Ruang Informasi Digital</small></span></button><div class="workspace-label"><span class="workspace-dot"></span> KANTOR WILAYAH ${ico('down',14)}</div><div class="nav-heading">MENU UTAMA</div><nav aria-label="Menu utama">${nav.slice(0,5).map(n=>`<button data-nav="${n[0]}" class="nav-item ${n[0]==='dashboard'?'active':''}">${ico(n[2],19)}<span>${n[1]}</span>${n[0]==='dokumen'?`<span class="nav-count" id="docCountSidebar">${docs.length}</span>`:''}</button>`).join('')}</nav><div class="nav-heading second-heading">PENGELOLAAN</div><nav><button data-nav="pengaturan" class="nav-item">${ico('settings',19)}<span>Pengaturan & Akses</span></button></nav><div class="sidebar-bottom"><div class="mini-note"><span class="mini-note-icon">${ico('sparkle',15)}</span><b>Ruang kerja terpadu</b><p>Informasi KI, dokumen dan monitoring dalam satu portal.</p><button data-nav="indikator">Jelajahi indikator ${ico('arrow',14)}</button></div><div class="side-profile"><div class="avatar">AD</div><div><b>Admin Demo</b><small>Mode pratinjau</small></div><button class="icon-btn" id="userInfo">${ico('help',20)}</button></div></div></aside><div class="main-column"><header class="topbar"><div class="topbar-left"><button class="icon-btn menu-toggle" id="menuToggle" aria-label="Buka menu">${ico('menu',22)}</button><div class="breadcrumbs">Portal KI NTB ${ico('chevron',14)} <strong id="breadcrumbCurrent">Dashboard</strong></div></div><div class="topbar-actions"><button class="top-search" id="searchBtn">${ico('search',17)}<span>Cari data, dokumen...</span><kbd>⌘ K</kbd></button><button class="icon-btn help-btn" id="helpBtn" aria-label="Panduan demo">${ico('help',19)}</button><button class="icon-btn notify-btn" id="noticeBtn" aria-label="Notifikasi">${ico('bell',19)}<i></i></button><div class="header-avatar"><div class="avatar">AD</div></div></div><div class="notification-pop" id="notificationPop" hidden><div class="pop-title"><b>Aktivitas terbaru</b><button id="closeNotice">${ico('x',17)}</button></div>${activities.slice(0,3).map(a=>`<div class="notification-item"><span class="notification-dot"></span><div><b>${a[0]}</b><small>${a[2]} • Data contoh</small></div></div>`).join('')}</div></header><div class="demo-ribbon"><span class="demo-indicator"></span> MODE PROTOTYPE — seluruh angka, rekaman KI dan dokumen bawaan adalah data simulasi, bukan data resmi Kanwil Kemenkum NTB.</div><main class="content" id="content"></main></div></div><div id="modalLayer"></div><div id="toast" class="toast" hidden></div>`;
render();
document.addEventListener('click',e=>{const hit=(sel)=>e.target.closest(sel);if(hit('[data-close]')){closeModal();return}if(hit('[data-modal-backdrop]')&&e.target===hit('[data-modal-backdrop]')){closeModal();return}if(hit('[data-nav]')){navigate(hit('[data-nav]').dataset.nav);return}if(hit('[data-open]')){closeModal();openIndicator(hit('[data-open]').dataset.open);return}if(hit('[data-back]')){state.selected=null;render();return}if(hit('[data-related]')){state.filter=hit('[data-related]').dataset.related;state.cat='Semua';navigate('dokumen');state.filter=hit('[data-related]')?.dataset.related||state.filter;render();return}if(hit('[data-cat]')){state.cat=hit('[data-cat]').dataset.cat;render();return}if(hit('[data-document]')){let id=hit('[data-document]').dataset.document;closeModal();showDoc(id);return}if(hit('[data-upload]')){uploadDialog();return}if(hit('[data-download]')){const id=hit('[data-download]').dataset.download;if(localFiles.has(id)){const d=docs.find(x=>x.id===id),a=document.createElement('a');a.href=localFiles.get(id);a.download=d.name;a.click()}else toast('Dokumen ini hanya contoh. File asli belum tersedia di Drive.');return}if(hit('[data-settings]')){state.settings=hit('[data-settings]').dataset.settings;render();return}if(hit('[data-catalog]')){toast('Pintasan contoh; URL resmi belum dikonfigurasi.');return}if(hit('[data-save-upload]')){let file=document.querySelector('#uploadFile')?.files?.[0];if(!file){toast('Pilih file terlebih dahulu.');return}if(file.size>10485760){toast('Maksimal ukuran file adalah 10 MiB.');return}let ext=file.name.split('.').pop().toLowerCase();if(!['pdf','doc','docx','ppt','pptx','xls','xlsx','png','jpg','jpeg'].includes(ext)){toast('Tipe file tidak didukung pada demo.');return}let id='LOCAL-'+Date.now();localFiles.set(id,URL.createObjectURL(file));docs.unshift({id,name:file.name,category:document.querySelector('#uploadType').value,indicator:document.querySelector('#uploadIndicator').value==='none'?null:document.querySelector('#uploadIndicator').value,date:'Baru ditambahkan',size:(file.size/1048576).toFixed(1)+' MB',format:ext.toUpperCase(),owner:'Sesi Demo'});state.cat='Semua';state.filter='all';state.docQ='';closeModal();navigate('dokumen');document.querySelector('#docCountSidebar').textContent=docs.length;toast('File hanya ditambahkan ke sesi browser, tidak terunggah ke Drive.');return}if(hit('[data-toast-close]'))document.querySelector('#toast').hidden=true});
document.addEventListener('input',e=>{if(e.target.id==='docSearch'){state.docQ=e.target.value;document.querySelector('#docTable').innerHTML=tableDocuments()}if(e.target.id==='globalSearch'){state.searchQ=e.target.value;renderSearch()}if(e.target.id==='uploadFile'){let f=e.target.files[0];document.querySelector('#chosenFile').textContent=f?.name||'Klik untuk pilih dokumen';document.querySelector('#chosenSize').textContent=f?(f.size/1048576).toFixed(2)+' MiB':'Maks. 10 MiB'}});
document.addEventListener('change',e=>{if(e.target.id==='docFilter'){state.filter=e.target.value;document.querySelector('#docTable').innerHTML=tableDocuments()}if(e.target.id==='region'){state.region=e.target.value;render()}});
document.querySelector('#searchBtn').onclick=searchDialog;document.querySelector('#helpBtn').onclick=()=>toast('Demo: jelajahi menu, buka indikator, cari dokumen, atau upload file lokal.');document.querySelector('#userInfo').onclick=()=>toast('Admin Demo; login Supabase belum dihubungkan.');document.querySelector('#menuToggle').onclick=()=>{document.querySelector('.sidebar').classList.add('mobile-open');document.querySelector('#scrim').hidden=false};document.querySelector('#scrim').onclick=()=>{document.querySelector('.sidebar').classList.remove('mobile-open');document.querySelector('#scrim').hidden=true};document.querySelector('#noticeBtn').onclick=()=>document.querySelector('#notificationPop').hidden=!document.querySelector('#notificationPop').hidden;document.querySelector('#closeNotice').onclick=()=>document.querySelector('#notificationPop').hidden=true;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.querySelector('#notificationPop').hidden=true;document.querySelector('.sidebar').classList.remove('mobile-open');document.querySelector('#scrim').hidden=true}if(((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k')||(e.key==='/'&&!['INPUT','TEXTAREA'].includes(e.target.tagName))){e.preventDefault();searchDialog()}if(e.key==='Enter'&&e.target.matches('tr[data-document]'))showDoc(e.target.dataset.document)});
</script></body></html>
